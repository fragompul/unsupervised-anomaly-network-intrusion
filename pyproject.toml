[project]
name = "ids-anomaly"
version = "0.1.0"
description = "Unsupervised dimensionality reduction, clustering and anomaly detection benchmark on network intrusion flow data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fran Gomez" }]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.38",
    "torch>=2.3",
    "optuna>=3.6",
    "bokeh>=3.5",
    "joblib>=1.4",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "dashboard", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# N803/N806: `X`/`X_train` etc. for feature matrices is the universal scikit-learn/ML convention.
ignore = ["E501", "N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "dashboard"]
