[project]
name = "ids-anomaly"
version = "0.2.0"
description = "Noctua: a reproducible research benchmark for unsupervised network intrusion detection under drift, contamination and dataset shift."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fran Gomez" }]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.38",
    "torch>=2.3",
    "optuna>=3.6",
    "bokeh>=3.5",
    "joblib>=1.4",
    "pyarrow>=16.0",
    "pyod>=2.0",
    "shap>=0.46",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "pre-commit>=3.7",
    "httpx>=0.27",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
paper = [
    "matplotlib>=3.9",
    "scikit-posthocs>=0.9",
]
notebooks = [
    "jupyter>=1.0",
    "nbconvert>=7.16",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "dashboard", "scripts"]
# Notebooks legitimately need `sys.path.insert` before local imports (E402) -- exploration-only,
# not part of the linted/tested package surface.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# N803/N806: `X`/`X_train` etc. for feature matrices is the universal scikit-learn/ML convention.
ignore = ["E501", "N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "dashboard"]
markers = ["slow: long-running tests (deselect with -m 'not slow')"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["ids_anomaly"]
